<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wheel Decider — add your options, spin the wheel, and let it make the choice for you.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#2b69ed">
    <title>Wheel Decider</title>

    <!-- SVG first: browsers that support it scale one crisp file to every size.
         The PNGs are the fallback, and 16x16 matters most — that is the size a
         browser tab actually renders, and letting it downsample a 32px icon is
         what turned the wheel into a grey smudge. -->
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main class="page">
        <h1>Wheel Decider</h1>

        <div id="wheelContainer">
            <!-- role/aria-label give the wheel an accessible name; the fallback
                 text inside is shown if canvas is unsupported. -->
            <canvas id="myCanvas" width="400" height="400"
                    role="img"
                    aria-label="Prize wheel. Add segments below, then press Spin.">
                Your browser does not support the canvas element, so the wheel cannot be displayed.
            </canvas>

            <!-- The winner marker. It sits OUTSIDE the canvas on purpose: the
                 canvas itself is rotated during a spin, so a pointer drawn on
                 it would turn with the wheel and never point at anything. -->
            <div id="wheelPointer" aria-hidden="true"></div>

            <button type="button" id="spinButton">
                <span>Spin</span>
            </button>
        </div>

        <!-- role="status" + aria-live make the spin result announced by screen
             readers. Without it the app's single most important output was silent. -->
        <p id="segmentNameDisplay" role="status" aria-live="polite" aria-atomic="true"></p>

        <div class="add-row">
            <label for="segmentText">Segment text</label>
            <input type="text" id="segmentText" name="segmentText"
                   placeholder="e.g. Pizza" autocomplete="off" maxlength="40"
                   enterkeyhint="done">
            <!-- type="button" everywhere: these are not inside a form, and an
                 implicit submit would reload the page out from under script.js. -->
            <button type="button" id="addSegmentButton">Add Segment</button>
        </div>

        <div class="controls">
            <button type="button" id="editSegmentButton">Edit Segment</button>
            <button type="button" id="deleteSegmentButton">Delete Segment</button>
            <!-- Styled as a quiet outline button, not a third gradient: this
                 resets the whole wheel rather than acting on one segment. -->
            <button type="button" id="newWheelButton" class="btn-quiet">New Wheel</button>
        </div>

        <noscript>
            <p class="noscript">This wheel needs JavaScript enabled to run.</p>
        </noscript>
    </main>

    <!-- type="module" so script.js can import the pure data layer from
         core/storage.js. Modules are deferred and scoped, so nothing here
         leaks onto window. -->
    <script src="main.js" type="module"></script>
</body>
</html>
